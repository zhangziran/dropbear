name: Build Dropbear for Soyealink UDX710

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Cross Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make autoconf automake libtool

      - name: Configure Dropbear (AArch64 Static)
        run: |
          # 开启全功能静态编译，针对 ARM64 / UDX710 嵌入式环境
          ./configure \
            --host=aarch64-linux-gnu \
            --enable-static \
            --disable-zlib \
            --disable-pam \
            CFLAGS="-O2 -Wall" \
            STATIC=1

      - name: Build Dropbear Suite
        run: |
          # 编译 SSH 服务端、客户端、SCP 及密钥工具
          make -j$(nproc) PROGRAMS="dropbear scp dbclient dropbearkey dropbearconvert" SCPPROGRESS=1
          
          # 剥离调试符号以最大化压缩二进制体积
          aarch64-linux-gnu-strip dropbear scp dbclient dropbearkey dropbearconvert

      - name: Prepare Artifacts
        run: |
          mkdir -p dropbear_arm64_pkg
          cp dropbear scp dbclient dropbearkey dropbearconvert dropbear_arm64_pkg/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-soyealink-udx710-arm64
          path: dropbear_arm64_pkg/*
