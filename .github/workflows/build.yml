name: Build Dropbear for Soyealink UDX710

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 精简安装：只安装 ARM64 交叉编译器和 libcrypt 库
      - name: Install Dependencies & Cross Toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make autoconf automake libtool libcrypt-dev:arm64

      # 2. 精简配置：直接开启 --enable-static 静态编译并加上 LIBS="-lcrypt"
      - name: Configure Dropbear (AArch64 Static)
        run: |
          ./configure \
            --host=aarch64-linux-gnu \
            --enable-static \
            --disable-zlib \
            --disable-pam \
            CFLAGS="-O2 -Wall" \
            LIBS="-lcrypt" \
            STATIC=1

      # 3. 精简编译：指定只编译你需要的 dropbear, scp, dbclient, dropbearkey, dropbearconvert
      - name: Build Dropbear Suite
        run: |
          make -j$(nproc) PROGRAMS="dropbear scp dbclient dropbearkey dropbearconvert" SCPPROGRESS=1
          aarch64-linux-gnu-strip dropbear scp dbclient dropbearkey dropbearconvert

      # 4. 精简打包：用 upload-artifact 将文件打成 ZIP 包供你在 GitHub 页面直接下载
      - name: Prepare & Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-soyealink-udx710-arm64
          path: dropbear scp dbclient dropbearkey dropbearconvert
